name: Build Windows EXE

on:
  push:
    paths:
      - 'sort_motifs.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --name sort_motifs sort_motifs.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: sort_motifs-windows
          path: dist/sort_motifs.exe
          retention-days: 30
